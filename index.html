    <script>
      (function() {
        // Fix for browser sandboxes where window.fetch or Window.prototype.fetch has a getter without a setter
        try {
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch') ||
                     Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
          if (desc && desc.get && !desc.set) {
            var currentFetch = desc.get.call(window);
            var safeDescriptor = {
              get: function() { return currentFetch; },
              set: function(newFetch) { currentFetch = newFetch; },
              configurable: true,
              enumerable: desc.enumerable !== undefined ? desc.enumerable : true
            };
            try {
              Object.defineProperty(window, 'fetch', safeDescriptor);
            } catch (e1) {
              try {
                Object.defineProperty(Window.prototype, 'fetch', safeDescriptor);
              } catch (e2) {}
            }
          }
        } catch (e) {}

        // Global error boundary for benign environment setter collisions
        window.addEventListener('error', function(event) {
          if (event && event.message && event.message.indexOf('Cannot set property fetch') !== -1) {
            if (typeof event.preventDefault === 'function') event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
